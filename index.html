<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Press Coin B2B</title>
    <!-- Configuração Oficial de Firebase para Login e Cadastro -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            createUserWithEmailAndPassword,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyOUYDMaK1NLcr1J-FrQeUQ2InYcytD2pIs",
            authDomain: "presscoinb2b.firebaseapp.com",
            projectId: "presscoinb2b",
            storageBucket: "presscoinb2b.appspot.com",
            messagingSenderId: "574399477044",
            appId: "1:574399477044:web:8744b69d93df4fb9f4a1a1",
            measurementId: "G-NLYSEY24FN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // Controlar alternância de telas (Login vs Dashboard)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'block';
                document.getElementById('user-email').innerText = user.displayName || user.email;
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('dashboard-screen').style.display = 'none';
            }
        });

        // 1. Função do botão de entrar com o Google
        window.fazerLoginGoogle = function() {
            signInWithPopup(auth, googleProvider)
                .catch((error) => {
                    alert("Erro no login com Google: " + error.message);
                });
        };

        // 2. Função do botão de criar nova conta com E-mail e Senha
        window.criarNovaConta = function(email, senha) {
            if (!email || !senha) {
                alert("Por favor, digite o e-mail e a senha.");
                return;
            }
            createUserWithEmailAndPassword(auth, email, senha)
                .catch((error) => {
                    alert("Erro ao criar conta: " + error.message);
                });
        };

        // 3. Função de Logout
        window.fazerLogout = function() {
            auth.signOut();
        };
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0f172a; color: #ffffff; }

        /* Tela de Login */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 320px; text-align: center; }
        .login-box h2 { margin-bottom: 20px; font-size: 20px; color: #38bdf8; }
        .btn-google { width: 100%; padding: 12px; background: #ea4335; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; }
        .btn-criar { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* Dashboard Principal */
        #dashboard-screen { display: none; padding: 20px; max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
        .btn-sair { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .panel { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 15px; }
        .panel h3 { color: #38bdf8; margin-bottom: 10px; }
    </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="login-screen">
    <div class="login-box">
      <h2>Press Coin B2B</h2>

      <!-- Botão de Login do Google -->
      <button onclick="fazerLoginGoogle()" class="btn-google">
        Entrar com o Google
      </button>

      <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">

      <!-- Caixinha de E-mail -->
      <input type="email" id="emailNovo" placeholder="Seu e-mail profissional">

      <!-- Caixinha de Senha -->
      <input type="password" id="senhaNova" placeholder="Sua senha">

      <!-- Botão Criar Conta -->
      <button onclick="criarNovaConta(document.getElementById('emailNovo').value, document.getElementById('senhaNova').value)" class="btn-criar">
        Criar Nova Conta
      </button>
    </div>
  </div>

  <!-- DASHBOARD PRINCIPAL -->
  <div id="dashboard-screen">
    <header>
      <div>
        <h2>Press Coin B2B — Painel</h2>
        <p style="font-size: 12px; color: #94a3b8;">Logado como: <span id="user-email" style="color: #38bdf8;"></span></p>
      </div>
      <button onclick="fazerLogout()" class="btn-sair">Sair</button>
    </header>

    <div class="panel">
      <h3>Cotações e Furos em Tempo Real</h3>
      <p style="font-size: 14px; color: #cbd5e1;">Plataforma integrada com BotNoturno24h operando com sucesso.</p>
    </div>

    <div class="panel">
      <h3>Histórico de Notícias Validadas</h3>
      <p style="font-size: 14px; color: #cbd5e1;">Nenhum alerta pendente na fila de validação por hash.</p>
    </div>
  </div>

</body>
</html>
