<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Press Coin B2B - Bolsa de Valores da Informação</title>
    
    <!-- Firebase SDK v10 (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyOUYDMaK1NLcr1J-FrQeUQ2InYcytD2pIs",
            authDomain: "presscoinb2b.firebaseapp.com",
            projectId: "presscoinb2b",
            storageBucket: "presscoinb2b.appspot.com",
            messagingSenderId: "574399477044",
            appId: "1:574399477044:web:8744b69d93df4fb9f4a1a1",
            measurementId: "G-NLYSEY24FN"
        };

        // Inicialização correta
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        // Função de Login Direta e Segura
        window.fazerLoginGoogle = async function() {
            try {
                // Forçamos o popup com tratamento limpo; em navegadores móveis modernos compatíveis com PWA/HTTPS, funciona perfeitamente se o domínio estiver autorizado.
                const result = await signInWithPopup(auth, provider);
                console.log("Login efetuado:", result.user);
            } catch (error) {
                console.error("Erro detalhado no login:", error);
                alert("Erro ao entrar com Google (" + error.code + "): " + error.message);
            }
        };

        // Função de Logout
        window.fazerLogout = async function() {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Erro ao sair:", error);
            }
        };

        // Monitor de Sessão Consolidado
        onAuthStateChanged(auth, (user) => {
            const loginCard = document.getElementById('login-card-container');
            const dashboardCard = document.getElementById('dashboard-container');
            const userEmailSpan = document.getElementById('user-email');

            if (user) {
                loginCard.style.display = 'none';
                dashboardCard.style.display = 'block';
                userEmailSpan.innerText = user.displayName || user.email;
            } else {
                loginCard.style.display = 'block';
                dashboardCard.style.display = 'none';
            }
        });
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 440px; }

        .brand-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .brand-title { color: #38bdf8; font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .badge-live { background: #065f46; color: #34d399; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; border: 1px solid #059669; }

        .card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
        .card-title { font-size: 14px; font-weight: 600; color: #94a3b8; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        .btn-google { width: 100%; padding: 14px; background: #ffffff; color: #1e293b; border: none; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .btn-google:active { background: #e2e8f0; }

        .btn-saas { width: 100%; padding: 14px; background: linear-gradient(135deg, #2563eb, #9333ea); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .metric-box { background: rgba(11, 15, 25, 0.6); border: 1px solid rgba(255, 255, 255, 0.04); padding: 14px; border-radius: 10px; }
        .metric-label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        .metric-value { font-size: 18px; font-weight: bold; }
        .text-green { color: #34d399; }
        .text-pink { color: #f472b6; }
        .text-blue { color: #38bdf8; }

        .bot-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .profit-tag { background: rgba(52, 211, 153, 0.15); color: #34d399; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .profit-value { font-size: 26px; font-weight: bold; color: #34d399; margin-bottom: 12px; }
        .neon-chart { width: 100%; height: 65px; display: flex; align-items: flex-end; position: relative; }
        .neon-svg { width: 100%; height: 100%; overflow: visible; }
    </style>
</head>
<body>

  <div class="container">
    
    <!-- TOPO DA PLATAFORMA -->
    <div class="brand-header">
      <div class="brand-title">
        <span style="background: #2563eb; width: 12px; height: 12px; border-radius: 3px; display:inline-block;"></span>
        PRESS COIN B2B
      </div>
      <div class="badge-live">AO VIVO</div>
    </div>

    <!-- CARTÃO DE LOGIN -->
    <div id="login-card-container" class="card">
      <div class="card-title">🔒 ACESSO DA IMPRENSA</div>
      <button type="button" onclick="fazerLoginGoogle()" class="btn-google">
        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Entrar com Google
      </button>
      <button type="button" onclick="alert('Módulo SaaS ativo.')" class="btn-saas">
        Cadastrar Novo Veículo (SaaS)
      </button>
    </div>

    <!-- PAINEL DO UTILIZADOR LOGADO -->
    <div id="dashboard-container" class="card" style="display: none; border-color: #34d399;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <div style="font-size: 11px; color: #94a3b8;">Sessão Ativa:</div>
          <div id="user-email" style="font-size: 13px; color: #38bdf8; font-weight: bold;"></div>
        </div>
        <button type="button" onclick="fazerLogout()" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;">Sair</button>
      </div>
    </div>

    <!-- MONETIZAÇÃO & RETENÇÃO B2B -->
    <div class="card">
      <div class="card-title">💰 MONETIZAÇÃO & RETENÇÃO B2B</div>
      <div class="metrics-grid">
        <div class="metric-box">
          <div class="metric-label">Assinaturas SaaS</div>
          <div class="metric-value text-blue">20 / 20</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">Comissão Retida</div>
          <div class="metric-value text-green">R$ 2.220</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">Fundo Anti-Fake</div>
          <div class="metric-value">R$ 98.000</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">Multas Executadas</div>
          <div class="metric-value text-pink">R$ 1.000</div>
        </div>
      </div>
    </div>

    <!-- BOT NOTURNO -->
    <div class="card">
      <div class="bot-header">
        <div class="card-title" style="margin-bottom: 0;">🌙 BOT NOTURNO (PILOTO AUTOMÁTICO)</div>
        <div class="profit-tag">+24.8%</div>
      </div>
      <div style="font-size: 12px; color: #94a3b8; margin-bottom: 4px;">Lucro em caixa gerado nesta madrugada:</div>
      <div class="profit-value">R$ 17.070,00</div>

      <div class="neon-chart">
        <svg class="neon-svg" viewBox="0 0 350 60" preserveAspectRatio="none">
          <defs>
            <linearGradient id="neonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#34d399" stop-opacity="0.4" />
              <stop offset="100%" stop-color="#34d399" stop-opacity="0.0" />
            </linearGradient>
          </defs>
          <path d="M 0,50 Q 75,10 150,35 T 300,20 L 350,5 L 350,60 L 0,60 Z" fill="url(#neonGrad)" />
          <path d="M 0,50 Q 75,10 150,35 T 300,20 L 350,5" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
          <circle cx="350" cy="5" r="4" fill="#34d399" />
        </svg>
      </div>
    </div>

  </div>

</body>
</html>
