<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Press Coin B2B - Bolsa de Valores da Informação</title>
    <!-- Configuração Oficial do Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyOUYDMaK1NLcr1J-FrQeUQ2InYcytD2pIs",
            authDomain: "presscoinb2b.firebaseapp.com",
            projectId: "presscoinb2b",
            storageBucket: "presscoinb2b.appspot.com",
            messagingSenderId: "574399477044",
            appId: "1:574399477044:web:8744b69d93df4fb9f4a1a1",
            measurementId: "G-NLYSEY24FN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // 1. Função de Login com Google (Pop-up direto)
        window.fazerLoginGoogle = function() {
            signInWithPopup(auth, googleProvider)
              .then((result) => {
                const user = result.user;
                alert("Login com Google realizado com sucesso, " + (user.displayName || user.email) + "!");
              })
              .catch((error) => {
                console.error("Erro no Google:", error);
                alert("Erro ao entrar com Google (" + error.code + "): " + error.message);
              });
        };

        // 2. Função de Criar Conta com E-mail e Senha
        window.criarNovaConta = function() {
            const emailInput = document.getElementById('emailInput').value;
            const senhaInput = document.getElementById('senhaInput').value;

            if (!emailInput || !senhaInput) {
                alert("Por favor, digite o e-mail e a senha nos campos.");
                return;
            }

            createUserWithEmailAndPassword(auth, emailInput, senhaInput)
              .then((userCredential) => {
                alert("Conta criada com sucesso para: " + userCredential.user.email);
              })
              .catch((error) => {
                alert("Erro ao criar conta: " + error.message);
              });
        };
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: #111827; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6); width: 100%; max-width: 380px; border: 1px solid #1f2937; text-align: center; }
        .login-card h2 { color: #38bdf8; font-size: 22px; margin-bottom: 8px; font-weight: 700; }
        .login-card p { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
        .btn-google { width: 100%; padding: 12px; background: #ffffff; color: #1e293b; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s; margin-bottom: 20px; }
        .btn-google:hover { background: #f1f5f9; }
        .divider { display: flex; align-items: center; text-align: center; color: #475569; font-size: 12px; margin: 20px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #1f2937; }
        .divider::not(:empty)::before { margin-right: .75em; }
        .divider::not(:empty)::after { margin-left: .75em; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; background: #0b0f19; border: 1px solid #334155; color: #ffffff; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus { border-color: #38bdf8; }
        .btn-submit { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .btn-submit:hover { background: #1d4ed8; }
    </style>
</head>
<body>

  <div class="login-card">
    <h2>Press Coin B2B</h2>
    <p>Bolsa de Valores da Informação</p>

    <!-- Botão Google -->
    <button onclick="fazerLoginGoogle()" class="btn-google">
      <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Entrar com o Google
    </button>

    <div class="divider">ou e-mail profissional</div>

    <!-- Inputs com IDs corretos -->
    <input type="email" id="emailInput" placeholder="Seu e-mail corporativo">
    <input type="password" id="senhaInput" placeholder="Sua senha de acesso">

    <!-- Botão Criar Conta -->
    <button onclick="criarNovaConta()" class="btn-submit">Criar Nova Conta</button>
  </div>

</body>
</html>
