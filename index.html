<!-- Configuração Oficial do Firebase para Login e Cadastro -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    signInWithPopup, 
    GoogleAuthProvider, 
    createUserWithEmailAndPassword 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyOUYDMaK1NLcr1J-FrQeUQ2InYcytD2pIs",
    authDomain: "presscoinb2b.firebaseapp.com",
    projectId: "presscoinb2b",
    storageBucket: "presscoinb2b.appspot.com",
    messagingSenderId: "574399477044",
    appId: "1:574399477044:web:8744b69d93df4fb9f4a1a1",
    measurementId: "G-NLYSEY24FN"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const googleProvider = new GoogleAuthProvider();

  // 1. Função do botão de entrar com o Google
  window.fazerLoginGoogle = function() {
    signInWithPopup(auth, googleProvider)
      .then((result) => {
        const user = result.user;
        alert("Login com Google realizado com sucesso, " + (user.displayName || user.email) + "!");
      })
      .catch((error) => {
        alert("Erro no login com Google: " + error.message);
      });
  };

  // 2. Função do botão de criar nova conta com E-mail e Senha
  window.criarNovaConta = function(email, senha) {
    if (!email || !senha) {
      alert("Por favor, digite o e-mail e a senha.");
      return;
    }
    createUserWithEmailAndPassword(auth, email, senha)
      .then((userCredential) => {
        alert("Conta criada com sucesso para: " + userCredential.user.email);
      })
      .catch((error) => {
        alert("Erro ao criar conta: " + error.message);
      });
  };
</script>
<body style="background-color: #0f172a; color: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;">

  <div style="background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 320px; text-align: center;">
    <h2 style="margin-bottom: 20px; font-size: 20px; color: #38bdf8;">Press Coin B2B</h2>

    <!-- Botão de Login do Google -->
    <button onclick="fazerLoginGoogle()" style="width: 100%; padding: 12px; background: #ea4335; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 15px;">
      Entrar com o Google
    </button>

    <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">

    <!-- Caixinha de E-mail -->
    <input type="email" id="emailNovo" placeholder="Seu e-mail profissional" style="width: 100%; padding: 10px; margin-bottom: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box;">

    <!-- Caixinha de Senha -->
    <input type="password" id="senhaNova" placeholder="Sua senha" style="width: 100%; padding: 10px; margin-bottom: 15px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box;">

    <!-- Botão Criar Conta -->
    <button onclick="criarNovaConta(document.getElementById('emailNovo').value, document.getElementById('senhaNova').value)" style="width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
      Criar Nova Conta
    </button>
  </div>

</body>
